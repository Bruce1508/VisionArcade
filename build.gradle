plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'org.example.visionarcade.app.VisionArcadeApp'
}

javafx {
    version = '25.0.4'
    modules = ['javafx.controls']
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.bytedeco:opencv-platform:4.14.0-1.5.14'
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.30.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'visionarcade.hardwareTests', System.getProperty('visionarcade.hardwareTests', 'false')
}
